cluster: macross

hardware:
  cuda_devices: "0,1"
  n_gpus: 2

paths:
  base_dir:   /home/bsandoiu/math-llm-infrastructure
  hf_cache:   /home/bsandoiu/.cache/huggingface
  data_dir:   /home/bsandoiu/math-llm-infrastructure/data/processed/openmathinstruct2/shards
  output_dir: /home/bsandoiu/math-llm-infrastructure/outputs/lora_8b

model:
  tokenizer:        meta-llama/Meta-Llama-3.1-8B-Instruct
  pretrained_model: meta-llama/Meta-Llama-3.1-8B-Instruct
  seq_len:          2048

training:
  batch_size:       1
  grad_accum_steps: 32
  lr:               0.0002
  steps:            408000     # same steps as 1B run (stopped at step_408000) — controls for data exposure
  epochs:           0
  num_workers:      2

precision:
  fp16: false
  bf16: true                   # plain LoRA — 8B fits in bf16 on 2x RTX 3090 (~20GB/GPU)

lora:
  use_lora:  true
  use_qlora: false
  rank:      64                # 167.8M trainable params; ~10× tokens/params at 1.67B tokens
  alpha:     128               # 2× rank
  dropout:   0.05              # LoRA dropout is the sole MC Dropout stochasticity source

logging:
  warmup_steps: 3000
  save_every:   2000
  log_every:    50
  resume:       false
  seed:         42

uncertainty:
  mc_dropout_rate: 0.0         # no hook on frozen base weights; rely on lora dropout only

validation:
  # total=13646  train=10918 (80%)  val=1364 (10%)  test=1364 (10%)
  val_shard_count:  1364
  test_shard_count: 1364
  val_every:        2000
  val_batches:      50
