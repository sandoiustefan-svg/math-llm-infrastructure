cluster: macross

hardware:
  cuda_devices: "0,1"
  n_gpus: 2

paths:
  base_dir:   /home/bsandoiu/math-llm-infrastructure
  hf_cache:   /home/bsandoiu/.cache/huggingface
  data_dir:   /home/bsandoiu/math-llm-infrastructure/data/processed/openmathinstruct2/shards
  output_dir: /home/bsandoiu/math-llm-infrastructure/outputs/qlora_8b

model:
  tokenizer:        meta-llama/Meta-Llama-3.1-8B-Instruct
  pretrained_model: meta-llama/Meta-Llama-3.1-8B-Instruct
  seq_len:          2048

training:
  batch_size:       1
  grad_accum_steps: 32
  lr:               0.0002
  steps:            0          # ignored when epochs > 0
  epochs:           1
  num_workers:      2

precision:
  fp16: false
  bf16: true

lora:
  use_lora:  true
  use_qlora: true
  rank:      16
  alpha:     32
  dropout:   0.05

qlora:
  quant_type:    nf4
  compute_dtype: bfloat16
  double_quant:  true

logging:
  warmup_steps: 3000
  save_every:   2000
  log_every:    50
  resume:       false
  seed:         42

uncertainty:
  mc_dropout_rate: 0.1   # dropout rate for the MC-dropout hook (after final LayerNorm)
                          # must be re-applied at inference with model.train() to keep it active

validation:
  # total=13646  train=10918 (80%)  val=1364 (10%)  test=1364 (10%)
  val_shard_count:  1364
  test_shard_count: 1364
  val_every:        2000
  val_batches:      50
