cluster: macross

hardware:
  cuda_devices: "0,1"
  n_gpus: 2

paths:
  data_dir: /home/bsandoiu/math-llm-infrastructure/data/processed/openmathinstruct2/shards
  output_dir: /home/bsandoiu/math-llm-infrastructure/outputs/qlora_8b

model:
  tokenizer: meta-llama/Meta-Llama-3.1-8B-Instruct
  pretrained_model: meta-llama/Meta-Llama-3.1-8B-Instruct
  seq_len: 2048

training:
  batch_size: 1
  grad_accum_steps: 16
  lr: 0.0002
  steps: 10000
  epochs: 3
  num_workers: 2

precision:
  fp16: true
  bf16: false

lora:
  use_lora: true
  use_qlora: true
  rank: 16
  alpha: 32
  dropout: 0.05

qlora:
  quant_type: nf4
  compute_dtype: float16
  double_quant: true

logging:
  warmup_steps: 100
  save_every: 500
  log_every: 20
  resume: false
  seed: 42

validation:
  val_shard_count: 1
  val_every: 500
  val_batches: 50