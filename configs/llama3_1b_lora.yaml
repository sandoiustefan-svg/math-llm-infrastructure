cluster: macross

hardware:
  cuda_devices: "0,1"
  n_gpus: 2

paths:
  base_dir:   /home/bsandoiu/math-llm-infrastructure
  hf_cache:   /home/bsandoiu/.cache/huggingface
  data_dir:   /home/bsandoiu/math-llm-infrastructure/data/processed/openmathinstruct2/shards
  output_dir: /home/bsandoiu/math-llm-infrastructure/outputs/lora_1b

model:
  tokenizer:        meta-llama/Llama-3.2-1B-Instruct
  pretrained_model: meta-llama/Llama-3.2-1B-Instruct
  seq_len:          2048

training:
  batch_size:       1
  grad_accum_steps: 32
  lr:               0.0002
  steps:            1100000    # ~20% of one epoch (~4-4.5 days on 2x RTX 3090)
  epochs:           0
  num_workers:      2

precision:
  fp16: false
  bf16: true

lora:
  use_lora:  true
  use_qlora: false             # plain LoRA — 1B fits in bf16, no quantization needed
  rank:      16
  alpha:     32
  dropout:   0.05

logging:
  warmup_steps: 1000
  save_every:   2000
  log_every:    50
  resume:       false
  seed:         42

uncertainty:
  mc_dropout_rate: 0.1

validation:
  val_shard_count:  1364
  test_shard_count: 1364
  val_every:        2000
  val_batches:      50
